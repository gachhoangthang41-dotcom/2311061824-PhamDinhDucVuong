server:
  port: 0

partner:
  api-key: test-partner-api-key

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:18081
              predicates:
                - Path=/api/auth/**
            - id: course-service-list
              uri: http://localhost:18082
              predicates:
                - Path=/api/courses
            - id: course-service-detail
              uri: http://localhost:18082
              predicates:
                - Path=/api/courses/**
            - id: registration-service-list
              uri: http://localhost:18083
              predicates:
                - Path=/api/registrations
            - id: registration-service-detail
              uri: http://localhost:18083
              predicates:
                - Path=/api/registrations/**
            - id: course-service-partner
              uri: http://localhost:18082
              predicates:
                - Path=/api/public/courses
